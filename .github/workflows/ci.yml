name: CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  static-and-compose:
    name: Static, Security & Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Validate Docker Compose Configuration
        run: |
          bash services/homepage/tests/compose.sh

      - name: Run Static and Security Checks
        run: |
          bash services/homepage/tests/static.sh

      - name: Run Synthetic Validators Unit Tests
        run: |
          python3 services/homepage/tests/ci_synthetic_test.py

  powershell-client-scripts:
    name: Windows Client PowerShell Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate PowerShell Scripts Syntax
        shell: pwsh
        run: |
          $allValid = $true
          $files = Get-ChildItem -Path clients/windows -Filter *.ps1 -Recurse
          foreach ($file in $files) {
              $tokens = $null
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
              if ($errors.Count -gt 0) {
                  Write-Error "Syntax error in $($file.FullName):"
                  $errors | ForEach-Object { Write-Error $_.Message }
                  $allValid = $false
              } else {
                  Write-Host "✓ Valid syntax: $($file.FullName)"
              }
          }
          if (-not $allValid) {
              exit 1
          }

  external-links:
    name: Curated External Links Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify External AI and Cloud Services URLs
        run: |
          external_urls=(
              'https://chatgpt.com/'
              'https://gemini.google.com/'
              'https://claude.ai/'
              'https://www.perplexity.ai/'
              'https://grok.com/'
              'https://copilot.microsoft.com/'
              'https://chat.mistral.ai/'
              'https://github.com/copilot'
              'https://aistudio.google.com/'
              'https://build.nvidia.com/'
              'https://login.tailscale.com/admin/machines'
              'https://github.com/'
          )

          failed=0
          for url in "${external_urls[@]}"; do
              result="$(curl --silent --show-error --location --noproxy '*' \
                  --connect-timeout 10 --max-time 30 --output /dev/null \
                  --write-out '%{http_code} %{ssl_verify_result}' "${url}" || echo "FAIL 1")"
              if [[ "${result}" =~ ^([23][0-9]{2}|401|403|429)\ 0$ ]]; then
                  echo "✓ ${url} -> ${result}"
              else
                  echo "✗ ${url} -> ${result}"
                  failed=$((failed + 1))
              fi
          done

          if [[ ${failed} -gt 0 ]]; then
              echo "Error: ${failed} external URLs failed verification."
              exit 1
          fi
